name: Build both displays
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/check.py
      - run: python -m pip install -r tools/requirements-c6.txt
      - run: python -m unittest discover -s tests -v

  firmware:
    needs: check
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    strategy:
      fail-fast: false
      matrix:
        board: [amoled-1.64, round-1.32]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and package
        shell: bash
        env:
          TABY_BOARD: ${{ matrix.board }}
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash firmware/tools/fetch-rive.sh
          python tools/build.py "$TABY_BOARD"
          python tools/package_release.py "$TABY_BOARD"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: taby-${{ matrix.board }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  c6:
    needs: check
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and package experimental C6
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Keep converter/test packages out of the SDK's Python environment.
          python -m venv .venv
          .venv/bin/python -m pip install -r tools/requirements-c6.txt
          .venv/bin/python tools/c6_assets.py
          .venv/bin/python tools/c6_assets.py --sd-card
          .venv/bin/python tools/check.py
          python tools/c6_build.py
          # IDF has now installed managed LVGL; renderer tests exercise real LVGL.
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python tools/c6_package.py --output dist/c6-development
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: taby-c6-development
          path: dist/c6-development/
          if-no-files-found: error
